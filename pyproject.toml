[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "proxima-x"
version = "0.1.0"
description = "Hidden-State Market Research Engine"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "numba>=0.60",
    "pyarrow>=17.0",
    "orjson>=3.10",
    "duckdb>=1.0",
    "lightgbm>=4.5",
    "hdbscan>=0.8.39",
    "umap-learn>=0.5",
    "faiss-cpu>=1.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "py-spy>=0.3",
    "scalene>=1.5",
    "ray>=2.9",
    "catboost>=1.2",
    "xgboost>=2.1",
]
