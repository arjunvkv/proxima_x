[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxima_honest_backtest"
version = "0.1.0"
description = "Anti-lookahead, anti-overfit backtesting framework — Python-only, MT5 tick data, multi-broker validation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=12.0",
    "scipy>=1.10",
    "MetaTrader5>=5.0",
]

[project.optional-dependencies]
validation = [
    "purgedcv>=0.1.0",
    "overfit-gauntlet>=0.1.0",
    "qtype>=0.1.0",
]
optimization = ["optuna>=3.0"]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
]
all = [
    "proxima_honest_backtest[validation]",
    "proxima_honest_backtest[optimization]",
    "proxima_honest_backtest[dev]",
]

[tool.setuptools.packages.find]
include = ["proxima_honest_backtest", "proxima_honest_backtest.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["proxima_honest_backtest"]
omit = ["*/tests/*", "*/examples/*"]
